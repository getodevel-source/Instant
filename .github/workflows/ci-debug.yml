# TEMPORAL — borrar cuando el CI vuelva a verde.
#
# Los logs de Actions no se pueden leer sin token, así que cuando la suite
# falla en Linux/macOS este workflow deja el output en un issue del repo
# (los issues sí son legibles). Corre solo con push; no publica nada.
name: ci-debug

on:
  push:
    branches: ["**"]

permissions:
  contents: read
  issues: write

jobs:
  suite-output:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Qt
        run: python -m pip install PySide6

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./dictado

      - name: Run verbose suite
        id: suite
        shell: bash
        run: |
          set +e
          cd dictado
          python -m unittest discover -s tests -v > "$RUNNER_TEMP/suite.log" 2>&1
          code=$?
          tail -c 60000 "$RUNNER_TEMP/suite.log" > "$RUNNER_TEMP/suite-tail.log"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "=== código de salida: $code ==="
          cat "$RUNNER_TEMP/suite-tail.log"

      - name: File an issue with the output (only on failure)
        if: steps.suite.outputs.code != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Salida de \`python -m unittest discover -s tests -v\` en \`${{ matrix.os }}\` (commit ${{ github.sha }})."
            echo
            echo '```'
            cat "$RUNNER_TEMP/suite-tail.log"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh issue create \
            --title "ci-debug ${{ matrix.os }} (temporal)" \
            --body-file "$RUNNER_TEMP/body.md"

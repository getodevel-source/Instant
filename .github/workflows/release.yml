name: release

on:
  push:
    tags:
      - "v*"

jobs:
  # La suite tiene que pasar antes de construir nada: un tag no deberia poder
  # publicar un binario de codigo roto.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary_name: Instant
            output: Instant.exe
          - os: ubuntu-latest
            platform: linux
            binary_name: instant-linux
            output: instant-linux
          - os: macos-latest
            platform: macos
            binary_name: instant-macos
            output: instant-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Tiene que coincidir con lo que exigen las dependencias fijadas y con
          # la version que usa la suite: numpy 2.5.3 pide Python 3.12 o mas, y
          # con 3.11 la instalacion falla antes de construir.
          python-version: "3.12"

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xclip xdotool

      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install package + PyInstaller
        shell: bash
        run: |
          pip install ./dictado
          pip install pyinstaller==6.22.3

      - name: Generate Windows icon
        if: runner.os == 'Windows'
        run: python dictado/build_icon.py

      - name: Version matches tag
        shell: bash
        run: |
          test "${{ github.ref_name }}" = "v$(python -c 'import sys; sys.path.insert(0, "dictado/src"); from instant_app import __version__; print(__version__)')"

      - name: Build Windows GUI executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ICON_PATH="$(python -c 'import os; print(os.path.abspath("dictado/build/instant.ico"))')"
          # The custom QtQml hook collects only the overlay's QML modules.
          pyinstaller --onefile --windowed --name "${{ matrix.binary_name }}" \
            --icon "$ICON_PATH" \
            --hidden-import instant_app.gui \
            --hidden-import instant_app.branding \
            --hidden-import pyexpat \
            --hidden-import PySide6.QtQml \
            --hidden-import PySide6.QtQuick \
            --additional-hooks-dir dictado/hooks \
            --add-data "dictado/src/instant_app/qml/overlay.qml;instant_app/qml" \
            --add-data "dictado/src/instant_app/qml/overlay_orbital.qml;instant_app/qml" \
            --collect-all sherpa_onnx \
            --collect-all sounddevice \
            --collect-all pystray \
            --collect-all PIL \
            dictado/src/instant_app/__main__.py

      - name: Build Unix CLI executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pyinstaller --onefile --name "${{ matrix.binary_name }}" \
            --hidden-import sherpa_onnx \
            --hidden-import sounddevice \
            --collect-all sherpa_onnx \
            --collect-all sounddevice \
            dictado/src/instant_app/__main__.py

      - name: Sign binary (SHA256 sidecar for the updater)
        # Python en vez de sha256sum: macOS no lo trae y el sidecar tiene
        # que salir igual en los tres sistemas o el updater lo rechaza.
        run: |
          python -c "import hashlib; data = open('dist/${{ matrix.output }}','rb').read(); open('dist/${{ matrix.output }}.sha256','w').write(f'{hashlib.sha256(data).hexdigest()}  ${{ matrix.output }}\n')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instant-${{ matrix.platform }}
          path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.output }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: instant-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  # La suite tiene que pasar antes de construir nada: un tag no deberia poder
  # publicar un binario de codigo roto.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary_name: Instant
            output: Instant.exe
          - os: ubuntu-latest
            platform: linux
            binary_name: instant-linux
            output: instant-linux
          - os: macos-latest
            platform: macos
            binary_name: instant-macos
            output: instant-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Tiene que coincidir con lo que exigen las dependencias fijadas y con
          # la version que usa la suite: numpy 2.5.3 pide Python 3.12 o mas, y
          # con 3.11 la instalacion falla antes de construir.
          python-version: "3.12"

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 xclip xdotool
          # El panel y el overlay web necesitan el stack de QtWebEngine (EGL/GL
          # incluidos) también para correr el smoke del binario congelado.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libcups2 \
            libatk-bridge2.0-0 libgbm1 libasound2t64 || true

      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install package + PyInstaller
        shell: bash
        run: |
          pip install ./dictado
          pip install pyinstaller==6.22.3

      - name: Generate Windows icon
        if: runner.os == 'Windows'
        run: python dictado/build_icon.py

      - name: Version matches tag
        shell: bash
        run: |
          test "${{ github.ref_name }}" = "v$(python -c 'import sys; sys.path.insert(0, "dictado/src"); from instant_app import __version__; print(__version__)')"

      - name: Build Windows portable (onefile)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ICON_PATH="$(python -c 'import os; print(os.path.abspath("dictado/build/instant.ico"))')"
          # The custom QtQml hook collects only the overlay's QML modules.
          pyinstaller --onefile --windowed --name "${{ matrix.binary_name }}" \
            --icon "$ICON_PATH" \
            --hidden-import instant_app.gui \
            --hidden-import instant_app.branding \
            --hidden-import pyexpat \
            --hidden-import PySide6.QtQml \
            --hidden-import PySide6.QtQuick \
            --additional-hooks-dir dictado/hooks \
            --add-data "dictado/src/instant_app/qml/overlay_web_host.qml;instant_app/qml" \
            --add-data "dictado/src/instant_app/qml/panel_web_host.qml;instant_app/qml" \
            --add-data "dictado/src/instant_app/web/overlay.html;instant_app/web" \
            --add-data "dictado/src/instant_app/web/panel.html;instant_app/web" \
            --add-data "instant-update.bat;." \
            --hidden-import PySide6.QtWebEngineQuick \
            --hidden-import PySide6.QtWebEngineCore \
            --hidden-import PySide6.QtWebChannel \
            --collect-all sherpa_onnx \
            --collect-all sounddevice \
            --collect-all pystray \
            --collect-all PIL \
            dictado/src/instant_app/__main__.py

      - name: Build Windows installer (onedir + Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ICON_PATH="$(python -c 'import os; print(os.path.abspath("dictado/build/instant.ico"))')"
          pyinstaller --noconfirm --onedir --windowed --name Instant \
            --icon "$ICON_PATH" \
            --hidden-import instant_app.gui \
            --hidden-import instant_app.branding \
            --hidden-import pyexpat \
            --hidden-import PySide6.QtQml \
            --hidden-import PySide6.QtQuick \
            --additional-hooks-dir dictado/hooks \
            --add-data "dictado/src/instant_app/qml/overlay_web_host.qml;instant_app/qml" \
            --add-data "dictado/src/instant_app/qml/panel_web_host.qml;instant_app/qml" \
            --add-data "dictado/src/instant_app/web/overlay.html;instant_app/web" \
            --add-data "dictado/src/instant_app/web/panel.html;instant_app/web" \
            --add-data "instant-update.bat;." \
            --hidden-import PySide6.QtWebEngineQuick \
            --hidden-import PySide6.QtWebEngineCore \
            --hidden-import PySide6.QtWebChannel \
            --collect-all sherpa_onnx \
            --collect-all sounddevice \
            --collect-all pystray \
            --collect-all PIL \
            dictado/src/instant_app/__main__.py
          VERSION="$(python -c 'import sys; sys.path.insert(0, "dictado/src"); from instant_app import __version__; print(__version__)')"
          SOURCE="$(python -c 'import os; print(os.path.abspath("dist/Instant"))')"
          # Inno Setup viene preinstalado en las imágenes de los runners.
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then ISCC="/c/Program Files/Inno Setup 6/ISCC.exe"; fi
          if [ ! -f "$ISCC" ]; then ISCC="iscc"; fi
          # MSYS (git-bash del runner) reescribe los argumentos que empiezan con
          # `/` a rutas de Windows: sin excluir la conversión, ISCC recibe
          # `DAppVersion=...` y lo toma como nombre de script (falla con
          # "You may not specify more than one script filename").
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' \
            "$ISCC" "/DAppVersion=$VERSION" "/DSourceDir=$SOURCE" \
            "/DIconFile=$ICON_PATH" installer/instant.iss
          ls -la dist/Instant-Setup.exe

      - name: Build Unix executable (daemon + panel)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # El panel y el overlay web son la UI de los tres sistemas: el
          # binario de Linux y macOS lleva PySide6 (QtWebEngine, red del canal
          # de instancia única y módulos QML de los hosts), las páginas web y
          # Pillow para los iconos, además del daemon/CLI de siempre.
          pyinstaller --onefile --name "${{ matrix.binary_name }}" \
            --hidden-import sherpa_onnx \
            --hidden-import sounddevice \
            --hidden-import instant_app.gui \
            --hidden-import PySide6.QtNetwork \
            --hidden-import PySide6.QtQml \
            --hidden-import PySide6.QtQuick \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --additional-hooks-dir dictado/hooks \
            --add-data "dictado/src/instant_app/qml/overlay_web_host.qml:instant_app/qml" \
            --add-data "dictado/src/instant_app/qml/panel_web_host.qml:instant_app/qml" \
            --add-data "dictado/src/instant_app/web/overlay.html:instant_app/web" \
            --add-data "dictado/src/instant_app/web/panel.html:instant_app/web" \
            --hidden-import PySide6.QtWebEngineQuick \
            --hidden-import PySide6.QtWebEngineCore \
            --hidden-import PySide6.QtWebChannel \
            --collect-all sherpa_onnx \
            --collect-all sounddevice \
            dictado/src/instant_app/__main__.py

      - name: Smoke del portable Windows congelado
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "instant-portable-smoke"
          $appData = Join-Path $root "appdata"
          $localData = Join-Path $root "localdata"
          $modelData = Join-Path $root "models"
          $configDir = Join-Path $appData "instant"
          New-Item -ItemType Directory -Force -Path $configDir, $localData, $modelData | Out-Null
          $stamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            (Join-Path $configDir "config.json"),
            ('{"update_last_check":' + $stamp + '}'), $utf8)
          $env:APPDATA = $appData
          $env:LOCALAPPDATA = $localData
          $env:DICTADO_DATA = $modelData
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QTWEBENGINE_CHROMIUM_FLAGS = "--disable-gpu"
          $exe = [System.IO.Path]::GetFullPath("dist/Instant.exe")
          $process = Start-Process -FilePath $exe -ArgumentList "setup" -PassThru -WindowStyle Hidden
          try {
            $logFile = Join-Path $configDir "instant.log"
            $deadline = [DateTime]::UtcNow.AddSeconds(75)
            $ready = $false
            while ([DateTime]::UtcNow -lt $deadline) {
              if (Test-Path -LiteralPath $logFile) {
                $ready = (Get-Content -LiteralPath $logFile -Raw -Encoding utf8) -match "panel abierto \(setup\)"
                if ($ready) { break }
              }
              $process.Refresh()
              if ($process.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              if (Test-Path -LiteralPath $logFile) { Get-Content -LiteralPath $logFile -Tail 40 -Encoding utf8 }
              throw "El portable Windows no abrió el panel congelado."
            }
            Start-Sleep -Seconds 3
            "portable Windows congelado OK"
          } finally {
            $running = Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $exe }
            foreach ($item in $running) {
              Stop-Process -Id $item.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Smoke del binario congelado (panel con WebEngine)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./dist/${{ matrix.binary_name }} --version
          export HOME="$(mktemp -d)"
          export DICTADO_DATA="$HOME/models"
          export QT_QPA_PLATFORM=offscreen
          # run_gui exige un entorno gráfico declarado; la plataforma offscreen
          # hace el trabajo, pero el gate mira DISPLAY.
          export DISPLAY="${DISPLAY:-:0}"
          export QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu"
          ./dist/${{ matrix.binary_name }} setup &
          PID=$!
          LOGS=("$HOME/.config/instant/instant.log" "$HOME/Library/Application Support/instant/instant.log")
          OK=""
          for _ in $(seq 1 90); do
            for log in "${LOGS[@]}"; do
              if grep -q "panel abierto (setup)" "$log" 2>/dev/null; then OK=1; fi
            done
            [ -n "$OK" ] && break
            sleep 1
          done
          kill $PID 2>/dev/null || true
          [ -n "$OK" ] || {
            echo "el panel congelado no abrió (WebEngine no arrancó):"
            cat "${LOGS[@]}" 2>/dev/null | tail -40
            exit 1
          }
          echo "panel congelado OK"

      - name: Sign binary (SHA256 sidecar for the updater)
        # Python en vez de sha256sum: macOS no lo trae y el sidecar tiene
        # que salir igual en los tres sistemas o el updater lo rechaza.
        run: |
          python -c "import hashlib; data = open('dist/${{ matrix.output }}','rb').read(); open('dist/${{ matrix.output }}.sha256','w').write(f'{hashlib.sha256(data).hexdigest()}  ${{ matrix.output }}\n')"

      - name: SHA256 sidecar for the installer
        if: runner.os == 'Windows'
        run: |
          python -c "import hashlib; name = 'Instant-Setup.exe'; data = open('dist/' + name, 'rb').read(); open('dist/' + name + '.sha256', 'w').write(f'{hashlib.sha256(data).hexdigest()}  {name}\n')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instant-${{ matrix.platform }}
          path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.output }}.sha256

      - name: Upload installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: instant-windows-installer
          path: |
            dist/Instant-Setup.exe
            dist/Instant-Setup.exe.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: instant-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

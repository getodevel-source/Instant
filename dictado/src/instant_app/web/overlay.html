<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!--QWEBCHANNEL-->
<script>
/* Overlay de Instant (daemon): misma anatomia que los overlays QML/Tk, en
   canvas2d. Dos estilos:
     classic  pastilla de vidrio con 9 barras que siguen su banda real, chip
              de tecla, spinner al transcribir, tilde verde + "Copiado" al
              confirmar.
     orbital  orbe con halo, anillo reactivo, espectro de 9 arcos y barrido
              al transcribir; al confirmar solo el tilde.
   Protocolo con el daemon (QWebChannel): pushFrame(json) con
   {mode, message, keyLabel, style, level?, pitch?, bands?}. La paleta repite
   instant_app/branding.py (ver tests/test_overlay_palette.py). */
(() => {
  const PI = Math.PI;

  // Tokens de marca (espejo de branding.PALETTE).
  const PALETTE = {
    accent: "#55d5c8", working: "#8fd7e8", green: "#7cdda6", amber: "#f2c36a",
    red: "#ff908b", text: "#eaf3f4", muted: "#9db0b6", glass: "#1b2b34",
    glass_alt: "#0f1c23", line: "#28414a"
  };
  const MARGIN = 12;   // margen transparente para la sombra dibujada.

  const canvas = document.getElementById('c');
  const C = canvas.getContext('2d');
  const state = {
    mode: 'idle', message: '', keyLabel: 'F9', style: 'classic',
    target: { level: 0, pitch: 0.5, bands: new Array(9).fill(0) },
    level: 0, pitch: 0.5, bands: new Array(9).fill(0)
  };
  let running = false, lastMs = 0, timeS = 0;

  const rgb = (hex) => {
    const v = parseInt(hex.slice(1), 16);
    return [v >> 16 & 255, (v >> 8) & 255, v & 255];
  };
  const rgba = (hex, a) => {
    const [r, g, b] = rgb(hex);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  };
  const mixHex = (h1, h2, t) => {
    const a = rgb(h1), b = rgb(h2);
    const v = a.map((x, i) => Math.round(x + (b[i] - x) * t));
    return '#' + v.map((channel) => channel.toString(16).padStart(2, '0')).join('');
  };

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    C.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Puente con el daemon ---
  let bridge = null;
  window.pushFrame = function (f) {
    const previousMode = state.mode;
    if (f.level !== undefined) state.target.level = f.level;
    if (f.pitch !== undefined) state.target.pitch = f.pitch;
    if (f.mode !== undefined) state.mode = f.mode;
    if (Array.isArray(f.bands) && f.bands.length === 9)
      state.target.bands = f.bands.map((value) => Math.max(0, Math.min(1, Number(value) || 0)));
    if (state.mode !== previousMode && state.mode !== 'listening' && state.mode !== 'starting') {
      state.target.level = 0;
      state.target.pitch = 0.5;
      state.target.bands.fill(0);
    }
    if (f.message !== undefined) state.message = f.message;
    if (f.keyLabel) state.keyLabel = f.keyLabel;
    if (f.style) state.style = f.style;
    start();
  };
  if (typeof qt !== 'undefined' && qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function (channel) {
      bridge = channel.objects.bridge;
      bridge.frame.connect(function (payload) {
        try {
          window.pushFrame(JSON.parse(payload));
        } catch (e) { /* frame corrupto: se descarta */ }
      });
      bridge.event(JSON.stringify({ kind: 'ready' }));
    });
  } else {
    // Sin canal no hay frames: se deja marca visible (y titulo) para el smoke.
    document.title = 'overlay-web sin-canal';
    C.fillStyle = "#ff908b";
    C.font = '12px sans-serif';
    C.fillText('sin canal', 16, 24);
  }
  if (!document.title)
    document.title = 'overlay-web';

  // --- Dibujo ---
  function pillBox(textWidth, textHeight) {
    const feedback = state.mode === 'notice' || state.mode === 'error';
    const w = feedback ? Math.min(424, Math.max(300, textWidth + 104)) : 300;
    const h = feedback ? Math.max(78, textHeight + 34) : 78;
    return {
      w: w, h: h, x: (window.innerWidth - w) / 2,
      y: window.innerHeight - MARGIN - h, feedback: feedback
    };
  }

  function roundRect(x, y, w, h, r) {
    C.beginPath();
    C.roundRect(x, y, w, h, r);
  }

  function modeColor() {
    if (state.mode === 'notice') return PALETTE.amber;
    if (state.mode === 'error') return PALETTE.red;
    if (state.mode === 'success') return PALETTE.green;
    if (state.mode === 'processing') return PALETTE.working;
    return PALETTE.accent;
  }

  function drawGlass(box) {
    C.save();
    C.shadowColor = 'rgba(0,0,0,0.45)';
    C.shadowBlur = 16;
    C.shadowOffsetY = 6;
    const grad = C.createLinearGradient(0, box.y, 0, box.y + box.h);
    grad.addColorStop(0, rgba(PALETTE.glass, 0.92));
    grad.addColorStop(1, rgba(PALETTE.glass_alt, 0.94));
    C.fillStyle = grad;
    roundRect(box.x, box.y, box.w, box.h, 18);
    C.fill();
    C.restore();
    C.strokeStyle = rgba(PALETTE.line, 0.9);
    C.lineWidth = 1;
    roundRect(box.x + 0.5, box.y + 0.5, box.w - 1, box.h - 1, 18);
    C.stroke();
  }

  function drawCheck(cx, cy, size, color, lineWidth) {
    C.strokeStyle = color;
    C.lineWidth = lineWidth;
    C.lineCap = 'round';
    C.lineJoin = 'round';
    C.beginPath();
    C.moveTo(cx - size * 0.5, cy + size * 0.05);
    C.lineTo(cx - size * 0.12, cy + size * 0.42);
    C.lineTo(cx + size * 0.55, cy - size * 0.38);
    C.stroke();
  }

  function drawClassic() {
    const voice = mixHex(PALETTE.accent, PALETTE.working, state.pitch);
    const msgFont = '14px "Segoe UI", system-ui, sans-serif';
    C.font = msgFont;
    const textW = state.message ? C.measureText(state.message).width : 0;
    const box = pillBox(textW, state.message ? 20 : 0);
    drawGlass(box);

    const cx = box.x + box.w / 2;
    const cy = box.y + box.h / 2;

    if (box.feedback) {
      C.font = msgFont;
      C.fillStyle = state.mode === 'error' ? PALETTE.red : PALETTE.amber;
      C.textAlign = 'center';
      C.textBaseline = 'middle';
      C.fillText(state.message, cx, cy + 1);
      return;
    }

    if (state.mode === 'success') {
      drawCheck(cx - 34, cy, 22, PALETTE.green, 3);
      C.font = '14px "Segoe UI", system-ui, sans-serif';
      C.fillStyle = PALETTE.green;
      C.textAlign = 'center';
      C.textBaseline = 'middle';
      C.fillText('Copiado', cx + 14, cy + 1);
      return;
    }

    // Barras: 9 bandas reales, con ataque por nivel y vaiven por indice.
    const barX = cx - 56;
    const floorH = 5, maxH = 34;
    for (let i = 0; i < 9; i++) {
      const band = state.bands[i] || 0;
      const act = Math.max(state.level, band);
      const wob = 0.78 + 0.22 * Math.sin(timeS * 4.2 - i * 0.72);
      const h = Math.min(maxH, floorH + (maxH - floorH) * (0.28 * act + 0.72 * band) * wob);
      const x = barX + i * 12.5;
      C.fillStyle = voice;
      C.globalAlpha = 0.35 + 0.65 * Math.min(1, 0.4 * act + 0.6 * band);
      roundRect(x, cy - h / 2, 3, h, 1.5);
      C.fill();
      C.globalAlpha = 1;
    }

    if (state.mode === 'processing') {
      const t0 = (timeS * (1000 / 1150)) % 1;
      C.strokeStyle = PALETTE.working;
      C.lineWidth = 3;
      C.lineCap = 'round';
      C.beginPath();
      C.arc(cx, cy, 15, t0 * 2 * PI, t0 * 2 * PI + PI * 0.55);
      C.stroke();
    }

    // Chip de tecla.
    C.font = '600 12px "Segoe UI", system-ui, sans-serif';
    const label = state.keyLabel || 'F9';
    const chipW = Math.max(30, C.measureText(label).width + 16);
    const chipX = box.x + box.w - chipW - 14;
    roundRect(chipX, cy - 11, chipW, 22, 11);
    C.fillStyle = rgba(PALETTE.line, 0.55);
    C.fill();
    C.fillStyle = PALETTE.muted;
    C.textAlign = 'center';
    C.textBaseline = 'middle';
    C.fillText(label, chipX + chipW / 2, cy + 1);
  }

  function drawOrbital() {
    const mode = state.mode;
    const cx = window.innerWidth / 2;
    const cy = 91;
    const voice = mixHex(PALETTE.accent, PALETTE.working, state.pitch);

    if (mode === 'notice' || mode === 'error') {
      const color = mode === 'error' ? PALETTE.red : PALETTE.amber;
      C.font = '600 12px "Segoe UI", system-ui, sans-serif';
      const w = Math.min(424, Math.max(172, C.measureText(state.message).width + 58));
      const box = { x: cx - w / 2, y: 178, w: w, h: 34, feedback: true };
      drawGlass(box);
      C.beginPath();
      C.arc(box.x + 18, box.y + 17, 8, 0, 2 * PI);
      C.fillStyle = rgba(color, 0.16);
      C.fill();
      C.strokeStyle = color;
      C.lineWidth = 1.7;
      C.beginPath();
      C.arc(box.x + 18, box.y + 17, 5, 0, 2 * PI);
      C.stroke();
      C.fillStyle = color;
      C.textAlign = 'left';
      C.textBaseline = 'middle';
      C.fillText(state.message || (mode === 'error' ? 'No se pudo completar' : 'Listo'), box.x + 33, box.y + 17, w - 43);
      return;
    }

    if (mode === 'success') {
      const box = { x: cx - 77, y: 178, w: 154, h: 34, feedback: true };
      drawGlass(box);
      drawCheck(cx - 33, box.y + 17, 15, PALETTE.green, 2.6);
      C.fillStyle = PALETTE.green;
      C.font = '700 10px "Segoe UI", system-ui, sans-serif';
      C.textAlign = 'left';
      C.textBaseline = 'middle';
      C.fillText('PEGADO', cx - 19, box.y + 17);
      return;
    }

    if (mode !== 'starting' && mode !== 'listening' && mode !== 'processing')
      return;

    const level = state.level;
    const processing = mode === 'processing';
    const beat = 0.5 + 0.5 * Math.sin(timeS * (processing ? 5.2 : 2.1));
    const coreR = processing ? 22 + beat * 2 : 23 + level * 9;
    const haloR = coreR + 31 + level * 20;
    const alpha = 0.025 + level * 0.055;

    // Soft light field under the instrument glass.
    C.save();
    C.globalCompositeOperation = 'lighter';
    const halo = C.createRadialGradient(cx, cy, 0, cx, cy, haloR);
    halo.addColorStop(0, rgba(PALETTE.accent, alpha));
    halo.addColorStop(0.38, rgba(PALETTE.accent, alpha * 0.42));
    halo.addColorStop(1, rgba(PALETTE.accent, 0));
    C.fillStyle = halo;
    C.beginPath();
    C.arc(cx, cy, haloR, 0, 2 * PI);
    C.fill();
    C.restore();

    // Orbiting particles move slowly; their light follows the real input level.
    for (let i = 0; i < 12; i++) {
      const a = timeS * (0.11 + (i % 3) * 0.018) + i * 2 * PI / 12;
      const pulse = 0.5 + 0.5 * Math.sin(timeS * 2.4 - i * 0.9);
      const r = 89 + 4 * pulse + level * 5;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r * 0.78;
      C.beginPath();
      C.arc(x, y, 0.8 + pulse * 1.15 + level * 0.7, 0, 2 * PI);
      C.fillStyle = rgba(PALETTE.accent, 0.18 + pulse * 0.2 + level * 0.28);
      C.fill();
    }

    // A fine outer track with a moving tracer.
    C.strokeStyle = rgba(PALETTE.working, 0.19 + level * 0.16);
    C.lineWidth = 1;
    C.beginPath();
    C.arc(cx, cy, 77, -0.2 * PI, 1.8 * PI);
    C.stroke();
    const tracer = timeS * (processing ? 1.2 : 0.24);
    C.strokeStyle = rgba(voice, 0.75);
    C.lineWidth = 2.2;
    C.lineCap = 'round';
    C.beginPath();
    C.arc(cx, cy, 77, tracer, tracer + 0.28 + level * 0.16);
    C.stroke();

    // Center orb: a luminous core with a glass highlight.
    C.fillStyle = rgba(PALETTE.accent, 0.1);
    C.beginPath();
    C.arc(cx, cy, coreR + 2, 0, 2 * PI);
    C.fill();
    C.strokeStyle = rgba(PALETTE.working, 0.46 + level * 0.24);
    C.lineWidth = 1;
    C.beginPath();
    C.arc(cx, cy, coreR + 1, -0.72 * PI, 0.18 * PI);
    C.stroke();
    const core = C.createRadialGradient(cx - coreR * 0.38, cy - coreR * 0.42, 1, cx, cy, coreR);
    core.addColorStop(0, rgba(PALETTE.accent, 0.92));
    core.addColorStop(0.64, voice);
    core.addColorStop(1, rgba(PALETTE.accent, 0.68));
    C.fillStyle = core;
    C.beginPath();
    C.arc(cx, cy, coreR, 0, 2 * PI);
    C.fill();

    // Nine radial capsules are smoothed from the microphone's real spectrum.
    const rot = timeS * (processing ? 0.78 : 0.12 + level * 0.22);
    const slot = 2 * PI / 9;
    for (let i = 0; i < 9; i++) {
      const band = state.bands[i] || 0;
      const angle = -PI / 2 + i * slot + rot;
      const inner = 58 + band * 2;
      const length = 10 + band * 23;
      const thickness = 3.2 + band * 3.2;
      const x = cx + Math.cos(angle) * inner;
      const y = cy + Math.sin(angle) * inner;
      C.save();
      C.translate(x, y);
      C.rotate(angle);
      C.fillStyle = mixHex(voice, PALETTE.text, 0.24);
      C.globalAlpha = 0.76 + band * 0.24;
      roundRect(0, -thickness / 2, length, thickness, thickness / 2);
      C.fill();
      C.restore();
    }
    const shine = C.createRadialGradient(cx - coreR * 0.3, cy - coreR * 0.36, 0, cx - coreR * 0.18, cy - coreR * 0.2, coreR * 0.9);
    shine.addColorStop(0, 'rgba(255,255,255,0.3)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    C.fillStyle = shine;
    C.beginPath();
    C.arc(cx, cy, coreR, 0, 2 * PI);
    C.fill();

    if (processing) {
      const sweep = (timeS * 1.15) % (2 * PI);
      C.strokeStyle = rgba(PALETTE.working, 0.92);
      C.lineWidth = 4;
      C.beginPath();
      C.arc(cx, cy, 77, sweep, sweep + 0.72);
      C.stroke();
    }

    // Status and shortcut stay readable without covering the active spectrum.
    const box = { x: cx - 91, y: 178, w: 182, h: 34, feedback: false };
    drawGlass(box);
    const statusColor = processing ? PALETTE.working : PALETTE.accent;
    C.beginPath();
    C.arc(box.x + 15, box.y + 17, 4, 0, 2 * PI);
    C.fillStyle = statusColor;
    C.fill();
    C.font = '700 9px "Segoe UI", system-ui, sans-serif';
    C.fillStyle = PALETTE.text;
    C.textAlign = 'left';
    C.textBaseline = 'middle';
    const label = processing ? 'TRANSCRIBIENDO' : mode === 'starting' ? 'PREPARANDO' : 'ESCUCHANDO';
    C.fillText(label, box.x + 26, box.y + 17);
    const key = state.keyLabel || 'F9';
    C.font = '600 9px "Segoe UI", system-ui, sans-serif';
    const chipW = Math.max(25, C.measureText(key).width + 12);
    const chipX = box.x + box.w - chipW - 6;
    roundRect(chipX, box.y + 7, chipW, 20, 10);
    C.fillStyle = rgba(PALETTE.accent, 0.14);
    C.fill();
    C.fillStyle = PALETTE.accent;
    C.textAlign = 'center';
    C.fillText(key, chipX + chipW / 2, box.y + 17);
  }
  function frame(now) {
    const dt = lastMs ? (now - lastMs) / 1000 : 0.016;
    lastMs = now;
    timeS += dt;
    state.level += (state.target.level - state.level) * (1 - Math.exp(-dt / 0.090));
    state.pitch += (state.target.pitch - state.pitch) * (1 - Math.exp(-dt / 0.140));
    for (let i = 0; i < state.bands.length; i++) {
      const target = state.target.bands[i] || 0;
      const tau = target > state.bands[i] ? 0.055 : 0.135;
      state.bands[i] += (target - state.bands[i]) * (1 - Math.exp(-dt / tau));
    }

    C.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (state.mode !== 'idle')
      (state.style === 'orbital' ? drawOrbital : drawClassic)();

    if (state.mode === 'idle' && !hasPending()) {
      running = false;
      return;
    }
    requestAnimationFrame(frame);
  }

  function hasPending() {
    return state.target.level > 0.001 || state.target.pitch !== 0.5
      || state.target.bands.some((b) => b > 0.001);
  }

  function start() {
    if (running)
      return;
    running = true;
    lastMs = 0;
    requestAnimationFrame(frame);
  }
  start();
})();
</script>
</body>
</html>
